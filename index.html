<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة مركز الراشد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg-dark: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-dark);
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* شاشة التحميل */
        #loader-wrapper {
            position: fixed;
            inset: 0;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: all 0.8s ease;
        }

        .orb-canvas {
            position: relative; width: 150px; height: 150px;
            display: flex; align-items: center; justify-content: center;
        }

        .ring {
            position: absolute; width: 100%; height: 100%;
            border: 2px solid transparent; border-top: 2px solid var(--primary);
            border-radius: 50%; animation: rotate 2s linear infinite;
        }

        .ring:nth-child(2) {
            width: 80%; height: 80%; border-top-color: var(--secondary);
            animation-duration: 1.5s; animation-direction: reverse;
        }

        .core { width: 20px; height: 20px; background: white; border-radius: 50%; box-shadow: 0 0 20px white; }

        @keyframes rotate { to { transform: rotate(360deg); } }

        /* المحتوى */
        #main-ui { opacity: 0; transform: translateY(30px); transition: 1s ease-out; text-align: center; }
        .show-ui { opacity: 1 !important; transform: translateY(0) !important; }

        .glass-card {
            background: var(--glass-bg); backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border); border-radius: 35px;
            padding: 40px; width: 320px; box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .nav-button {
            display: flex; justify-content: space-between; align-items: center;
            padding: 18px; margin-bottom: 15px; background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border); border-radius: 20px;
            color: white; text-decoration: none; transition: 0.4s;
        }

        .nav-button:hover { background: var(--primary); transform: translateX(-5px); }

        .logo-glow img { width: 100px; border-radius: 20px; margin-bottom: 20px; }

        .fade-out { opacity: 0; visibility: hidden; }
    </style>
</head>
<body>

    <div id="loader-wrapper">
        <div class="orb-canvas">
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="core"></div>
        </div>
        <h2 style="margin-top:20px">نظام إدارة المحل</h2>
    </div>

    <main id="main-ui">
        <header class="logo-glow">
            <img src="https://image2url.com/r2/default/images/1770819707908-9d1493d6-222f-4a2c-a3bb-db934121cb1e.png">
            <h1>مركز الراشد</h1>
        </header>

        <section class="glass-card">
            <a href="https://zaidon11.github.io/FinalV18/FinalV18" class="nav-button">
                <span>📦 نظام المخزن</span><span>←</span>
            </a>
            <a href="https://zaidon11.github.io/Rstore" class="nav-button">
                <span>💰 نظام الأقساط</span><span>←</span>
            </a>
        </section>
    </main>

    <script>
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('loader-wrapper').classList.add('fade-out');
                document.getElementById('main-ui').classList.add('show-ui');
            }, 2500);
        };
    </script>
</body>
</html>
